name: WebRTC C Sanitizers

on:
  push:
    branches:
      - develop
      - main
      - 'test-pr-*'
  pull_request:
    branches:
      - develop
      - main

env:
  AWS_KVS_LOG_LEVEL: 7
  DEBIAN_FRONTEND: noninteractive
  CC: clang
  CXX: clang++

jobs:
  ecr-login:
    uses: ./.github/workflows/ecr-public-login.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  address-sanitizer:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ASAN_OPTIONS: detect_odr_violation=0:detect_leaks=1
      LSAN_OPTIONS: suppressions=../tst/suppressions/LSAN.supp

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install clang

          # AWS SDK CPP dependencies (for tests)
          sudo apt-get -y install zlib1g-dev libcurl4-openssl-dev

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          cmake-version: '3.x'

      - name: Build repository
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_TEST=ON -DADDRESS_SANITIZER=ON -DPARALLEL_BUILD=ON
          make -j

      - name: Run tests
        working-directory: ./build
        run: |
          ./tst/webrtc_client_test

  # Same as address-sanitizer but with ENABLE_KVS_THREADPOOL=ON. The pre-resolved STUN address path, the
  # thread pool itself and the pool-dispatched DTLS handshake only exist in this configuration, so the
  # default-OFF job above never exercises them. (Note: ASan alone would not have caught #2408 on the real
  # path; that overrun stayed inside the heap-allocated IceAgent. This job is for the other thread-pool-only
  # code; the srflx regression itself is covered by the gtest and sample job added alongside it.)
  address-sanitizer-threadpool:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ASAN_OPTIONS: detect_odr_violation=0:detect_leaks=1
      LSAN_OPTIONS: suppressions=../tst/suppressions/LSAN.supp

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install clang

          # AWS SDK CPP dependencies (for tests)
          sudo apt-get -y install zlib1g-dev libcurl4-openssl-dev

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          cmake-version: '3.x'

      - name: Build repository
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_TEST=ON -DADDRESS_SANITIZER=ON -DENABLE_KVS_THREADPOOL=ON -DPARALLEL_BUILD=ON
          make -j

      - name: Run tests
        working-directory: ./build
        run: |
          ./tst/webrtc_client_test

  # Same as address-sanitizer but on the AWS-LC backend, so ASan also covers the
  # AWS-LC-only code that the default-OpenSSL jobs above never compile.
  # CryptoBackendTest in the suite checks that the loaded libcrypto is AWS-LC.
  #
  # Non-FIPS on purpose. A FIPS build disables AWS-LC's module integrity check
  # under a sanitizer, which voids the validation, so CMake refuses the
  # combination outright.
  address-sanitizer-aws-lc:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ASAN_OPTIONS: detect_odr_violation=0:detect_leaks=1
      LSAN_OPTIONS: suppressions=../tst/suppressions/LSAN.supp

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install clang

          # AWS SDK CPP dependencies (for tests)
          sudo apt-get -y install zlib1g-dev libcurl4-openssl-dev

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          cmake-version: '3.x'

      - name: Build repository
        run: |
          mkdir build
          cd build
          # ENABLE_AWS_SDK_IN_TESTS=OFF matches every AWS-LC job in ci.yml.
          # With it ON, the test binary links the AWS C++ SDK, whose CurlHttpClient
          # uses the system libcurl built against the system OpenSSL. Both that
          # libcrypto and AWS-LC's then live in one process, and the loader binds
          # libcurl's CRYPTO_get_ex_new_index into AWS-LC, whose CRYPTO_STATIC_MUTEX
          # is laid out differently. Aws::InitAPI then dies in pthread_rwlock_wrlock
          # on a lock AWS-LC never initialised. The default OpenSSL sanitizer jobs
          # survive the same mixing because both libraries are OpenSSL.
          cmake .. -DBUILD_TEST=ON -DUSE_AWS_LC=ON -DADDRESS_SANITIZER=ON \
            -DENABLE_AWS_SDK_IN_TESTS=OFF -DPARALLEL_BUILD=ON
          make -j

      - name: Run tests
        working-directory: ./build
        run: |
          ./tst/webrtc_client_test

  undefined-behavior-sanitizer:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install clang

          # AWS SDK CPP dependencies (for tests)
          sudo apt-get -y install zlib1g-dev libcurl4-openssl-dev

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          cmake-version: '3.x'

      - name: Build repository
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_TEST=ON -DUNDEFINED_BEHAVIOR_SANITIZER=ON -DPARALLEL_BUILD=ON
          make -j

      - name: Run tests
        working-directory: ./build
        run: |
          ./tst/webrtc_client_test

  # Same as undefined-behavior-sanitizer but on the AWS-LC backend. The tests
  # are built without the AWS C++ SDK for the reason given in
  # address-sanitizer-aws-lc. CryptoBackendTest in the suite checks that the
  # loaded libcrypto is AWS-LC.
  undefined-behavior-sanitizer-aws-lc:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install clang

          # AWS SDK CPP dependencies (for tests)
          sudo apt-get -y install zlib1g-dev libcurl4-openssl-dev

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          cmake-version: '3.x'

      - name: Build repository
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_TEST=ON -DUSE_AWS_LC=ON -DUNDEFINED_BEHAVIOR_SANITIZER=ON \
            -DENABLE_AWS_SDK_IN_TESTS=OFF -DPARALLEL_BUILD=ON
          make -j

      - name: Run tests
        working-directory: ./build
        run: |
          ./tst/webrtc_client_test

  # memory-sanitizer:
  #   runs-on: ubuntu-18.04
  #   env:
  #     CC: clang-7
  #     CXX: clang++-7
  #     AWS_KVS_LOG_LEVEL: 2
  #   steps:
  #     - name: Clone repository
  #       uses: actions/checkout@v6
