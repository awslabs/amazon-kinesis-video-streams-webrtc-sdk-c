  #       run: |
  #         sudo sh -c 'echo 0 > /proc/sys/net/ipv6/conf/all/disable_ipv6'
  #         mkdir build && cd build
  #         cmake .. -DMEMORY_SANITIZER=TRUE -DBUILD_TEST=TRUE
  #         make
  #         ulimit -c unlimited -S
  #         timeout --signal=SIGABRT 60m build/tst/webrtc_client_test

  thread-sanitizer:
    needs: ecr-login
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: public.ecr.aws/ubuntu/ubuntu:20.04_stable
      # Authenticated pull; see ecr-public-login.yml.
      credentials: ${{ fromJSON(needs.ecr-login.outputs.attempt == github.run_attempt && needs.ecr-login.outputs.credentials || '{}') }}

    env:
      TSAN_OPTIONS: second_deadlock_stack=1:halt_on_error=1:suppressions=../tst/suppressions/TSAN.supp

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          apt-get update
          apt-get -y install clang cmake build-essential git pkg-config
          
          # AWS SDK CPP dependencies (for tests)
          apt-get -y install zlib1g-dev libcurl4-openssl-dev

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          cmake-version: '3.x'

      - name: Build repository
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_TEST=ON -DTHREAD_SANITIZER=ON -DPARALLEL_BUILD=ON
          make -j

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run tests
        working-directory: ./build
        run: |
          ./tst/webrtc_client_test

  # Same as thread-sanitizer but on the AWS-LC backend. The tests are built
  # without the AWS C++ SDK for the reason given in address-sanitizer-aws-lc.
  # CryptoBackendTest in the suite checks that the loaded libcrypto is AWS-LC.
  thread-sanitizer-aws-lc:
    needs: ecr-login
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: public.ecr.aws/ubuntu/ubuntu:20.04_stable
      # Authenticated pull; see ecr-public-login.yml.
      credentials: ${{ fromJSON(needs.ecr-login.outputs.attempt == github.run_attempt && needs.ecr-login.outputs.credentials || '{}') }}

    env:
      TSAN_OPTIONS: second_deadlock_stack=1:halt_on_error=1:suppressions=../tst/suppressions/TSAN.supp

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          apt-get update
          apt-get -y install clang cmake build-essential git pkg-config

          # AWS SDK CPP dependencies (for tests)
          apt-get -y install zlib1g-dev libcurl4-openssl-dev

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          cmake-version: '3.x'

      - name: Build repository
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_TEST=ON -DUSE_AWS_LC=ON -DTHREAD_SANITIZER=ON \
            -DENABLE_AWS_SDK_IN_TESTS=OFF -DPARALLEL_BUILD=ON
          make -j

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run tests
        working-directory: ./build
        run: |
          ./tst/webrtc_client_test
