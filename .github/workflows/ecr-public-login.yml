name: ECR Public login token

# Reusable workflow: mints a short-lived public.ecr.aws authorization token so
# that `container:` jobs pull their base image as an authenticated client.
#
# Why: anonymous pulls from public.ecr.aws are rate-limited per source IP, and
# GitHub-hosted runners share a small pool of egress IPs with every other
# GitHub Actions user. A single push to this repository pulls the Ubuntu base
# image ~30 times, so matrix jobs regularly fail at "Initialize containers"
# with `toomanyrequests: Data limit exceeded`. Authenticated pulls are counted
# against the AWS account that minted the token instead.
#
# How to use from another workflow:
#
#   jobs:
#     ecr-login:
#       uses: ./.github/workflows/ecr-public-login.yml
#       permissions:
#         id-token: write
#         contents: read
#       secrets: inherit
#
#     my-job:
#       needs: ecr-login
#       runs-on: ubuntu-latest
#       container:
#         image: public.ecr.aws/ubuntu/ubuntu:22.04_stable
#         credentials: ${{ fromJSON(needs.ecr-login.outputs.attempt == github.run_attempt && needs.ecr-login.outputs.credentials || '{}') }}
#
# Pass `credentials` as one mapping, `{}` when there is no token: the runner
# rejects an empty username or password ("Unexpected value ''") before the
# container starts. "Re-run failed jobs" does not re-run this workflow, so a
# re-run job would get the first attempt's token, which expires after 12 h; the
# attempt check makes those re-runs pull anonymously. "Re-run all jobs" mints a
# fresh token.
#
# Without `permissions: id-token: write` on the calling job the run fails at
# startup. Without `secrets: inherit` the role ARN is empty, the OIDC step
# fails, and every job pulls anonymously.

on:
  workflow_call:
    outputs:
      credentials:
        description: "JSON {username, password} for container.credentials; unset when no token was minted (e.g. pull requests from forks)"
        value: ${{ jobs.login.outputs.credentials }}
      attempt:
        description: "github.run_attempt in which the token was minted"
        value: ${{ jobs.login.outputs.attempt }}

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    outputs:
      credentials: ${{ steps.token.outputs.credentials }}
      attempt: ${{ github.run_attempt }}

    steps:
      - name: Configure AWS credentials
        id: aws
        # Pull requests from forks cannot mint an OIDC token, so this step fails
        # there. Keep the job green with no credentials output; consumers then
        # pass `{}` and the runner pulls anonymously, exactly as before this
        # workflow.
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # public.ecr.aws authenticates only through us-east-1.
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Get ECR Public token
        id: token
        if: steps.aws.outcome == 'success'
        # A failed token request also falls back to an anonymous pull, instead
        # of failing this job and skipping every job that needs it.
        continue-on-error: true
        run: |
          # The token is deliberately NOT registered with ::add-mask::. GitHub
          # drops any job output whose value matches a masked secret ("Skip
          # output since it may contain secret"), and `container.credentials`
          # needs the raw value before any step of the consuming job runs.
          # The token only lets its holder pull *public* images against this
          # account's quota for 12 hours; the CI role has no ECR push rights.
          # Never echo it in a step. Debug logging prints it anyway: here as
          # "Set output credentials = ...", and in every consuming job while
          # the runner evaluates `container:`.
          TOKEN=$(aws ecr-public get-login-password --region us-east-1)
          echo "credentials={\"username\":\"AWS\",\"password\":\"$TOKEN\"}" >> "$GITHUB_OUTPUT"

      - name: Report anonymous fallback
        if: steps.token.outcome != 'success'
        run: |
          echo "::warning title=ECR Public login skipped::No ECR Public token (fork PR, OIDC misconfiguration, or a failed token request); container jobs will pull public.ecr.aws images anonymously and may hit the per-IP pull quota."
